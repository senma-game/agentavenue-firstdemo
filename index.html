<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENT AVENUE</title>
<style>
:root{--bg:#f4f1ea;--fg:#1c1c22;--card:#fff;--line:#c9c3b4;--me:#1d6fd6;--cpu:#d6381d;--acc:#e8b100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161c;--fg:#ececf1;--card:#23242d;--line:#40424f;--me:#5aa2ff;--cpu:#ff7058;--acc:#f2c744;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center}
main{max-width:560px;margin:0 auto;padding:12px}
h1{letter-spacing:.25em;font-size:20px;margin:6px 0}
#ring{position:relative;width:260px;height:260px;margin:8px auto}
.cell{position:absolute;width:18px;height:18px;margin:-9px;border:1px solid var(--line);border-radius:50%}
.pc{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;line-height:26px;transition:all .4s}
#info{font-size:14px;min-height:40px}
.row{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.card{width:56px;height:80px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:26px;font-weight:700;cursor:pointer;position:relative}
.card.back{background:repeating-linear-gradient(45deg,var(--line),var(--line) 6px,var(--card) 6px,var(--card) 12px);color:transparent}
.card.up::after,.card.down::after{content:"表";position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--acc);color:#000;padding:0 5px;border-radius:6px}
.card.down::after{content:"裏";background:var(--fg);color:var(--bg)}
.card.sm{width:44px;height:62px;font-size:20px;cursor:default}
button.go{padding:10px 24px;font-size:16px;border:0;border-radius:8px;background:var(--acc);color:#000;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.4}
#log{font-size:13px;text-align:left;max-height:120px;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.lbl{font-size:12px;opacity:.7}
</style></head><body><main>
<h1>AGENT AVENUE</h1>
<div id="ring"></div>
<div id="info"></div>
<div class="lbl">CPUの手札</div><div class="row" id="chand"></div>
<div class="lbl" id="tlabel">場</div><div class="row" id="table"></div>
<div class="row"><button class="go" id="btn"></button></div>
<div class="lbl">あなたの手札</div><div class="row" id="phand"></div>
<div id="log"></div>
</main>
<script>
const N=20, GAP=10;
let a,b,deck,disc,hand,active,phase,sel,tbl,over,log;
// a: あなたの累計移動量 / b: CPUの累計移動量。差が±GAPになった側の勝ち
const $=id=>document.getElementById(id);
const shuffle=x=>{for(let i=x.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]]}return x};
function draw(w){if(!deck.length){deck=shuffle(disc);disc=[]}hand[w].push(deck.pop())}
function init(){
  a=0;b=0;disc=[];deck=[];for(let v=1;v<=5;v++)for(let i=0;i<6;i++)deck.push(v);shuffle(deck);
  hand={P:[],C:[]};for(let i=0;i<4;i++){draw('P');draw('C')}
  active=Math.random()<.5?'P':'C';over=null;log=[];sel=[];tbl=null;startTurn();
}
function startTurn(){
  sel=[];tbl=null;
  if(active==='P'){phase='play'}
  else{ // CPUが2枚出す
    const i=Math.random()*4|0;let j;do{j=Math.random()*4|0}while(j===i);
    tbl={up:hand.C[i],down:hand.C[j],iu:i,id:j};phase='choose';
  }
  render();
}
function apply(who,v){if(who==='P')a+=v;else b+=v}
function resolve(chooser,chosenIsUp){
  const act=chooser==='P'?'C':'P', t=tbl;
  const chosen=chosenIsUp?t.up:t.down, other=chosenIsUp?t.down:t.up;
  apply(chooser,chosen);apply(act,other);
  const nm=w=>w==='P'?'あなた':'CPU';
  log.unshift(`${nm(act)}が 表${t.up}/裏${t.down} → ${nm(chooser)}が「${chosenIsUp?'表':'裏'}」を選択。${nm(chooser)}+${chosen}、${nm(act)}+${other}`);
  t.revealed=true;t.chosenUp=chosenIsUp;t.chooser=chooser;
  if(a-b>=GAP)over='P';else if(b-a>=GAP)over='C';
  phase='result';render();
}
function next(){
  // 使用カードを捨て、補充
  const t=tbl,act=active;
  const idx=[t.iu,t.id].sort((x,y)=>y-x);
  idx.forEach(i=>disc.push(...hand[act].splice(i,1)));
  while(hand[act].length<4)draw(act);
  active=act==='P'?'C':'P';startTurn();
}
function cpuChoose(){ // 表の数字が大きいほど表を取りやすい。少しランダム
  const p=Math.min(.9,Math.max(.1,(tbl.up-1)/4*.8+.1));
  return Math.random()<p;
}
$('btn').onclick=()=>{
  if(over){init();return}
  if(phase==='play'&&sel.length===2){
    tbl={up:hand.P[sel[0]],down:hand.P[sel[1]],iu:sel[0],id:sel[1]};
    resolve('C',cpuChoose());
  }else if(phase==='result')next();
};
function click(i){
  if(phase!=='play')return;
  const k=sel.indexOf(i);
  if(k>=0)sel.splice(k,1);else if(sel.length<2)sel.push(i);
  render();
}
function chooseMine(isUp){if(phase==='choose')resolve('P',isUp)}
function mk(txt,cls,fn){const e=document.createElement('button');e.className='card '+(cls||'');e.textContent=txt;if(fn)e.onclick=fn;return e}
function render(){
  // ring
  const R=$('ring');R.innerHTML='';
  for(let i=0;i<N;i++){const ang=i/N*2*Math.PI-Math.PI/2;const c=document.createElement('div');c.className='cell';c.style.left=130+110*Math.cos(ang)+'px';c.style.top=130+110*Math.sin(ang)+'px';R.appendChild(c)}
  const place=(pos,col,txt,r)=>{const ang=(((pos%N)+N)%N)/N*2*Math.PI-Math.PI/2;const e=document.createElement('div');e.className='pc';e.style.background=col;e.textContent=txt;e.style.left=130+r*Math.cos(ang)+'px';e.style.top=130+r*Math.sin(ang)+'px';R.appendChild(e)};
  place(a,'var(--me)','YOU',110);place(GAP+b,'var(--cpu)','CPU',110);
  const toWin=GAP-(a-b), toLose=GAP-(b-a);
  $('info').innerHTML=over?`<b>${over==='P'?'🎉 あなたの勝ち!':'💀 CPUの勝ち…'}</b>`:
    `あなたはCPUまで あと<b>${toWin}</b>マス ／ CPUはあなたまで あと<b>${toLose}</b>マス<br>`+
    (phase==='play'?'あなたの手番:カードを2枚選ぶ(1枚目=表、2枚目=裏)':phase==='choose'?'CPUの手番:どちらを自分に適用する?':'');
  // hands
  $('chand').innerHTML='';hand.C.forEach(()=>$('chand').appendChild(mk('?','back sm')));
  const ph=$('phand');ph.innerHTML='';
  hand.P.forEach((v,i)=>{const k=sel.indexOf(i);ph.appendChild(mk(v,k===0?'up':k===1?'down':'',()=>click(i)))});
  // table
  const T=$('table');T.innerHTML='';
  if(tbl){
    const showDown=tbl.revealed;
    const ce=phase==='choose';
    T.appendChild(mk(tbl.up,'up',ce?()=>chooseMine(true):null));
    T.appendChild(mk(showDown?tbl.down:'?',showDown?'down':'down back',ce?()=>chooseMine(false):null));
    $('tlabel').textContent=ce?'タップで「自分に適用」するカードを選ぶ(もう片方は相手が進む)':'場(選ばれた方が選んだ側の駒を進める)';
  }else $('tlabel').textContent='場';
  const b2=$('btn');b2.disabled=false;
  if(over)b2.textContent='もう一度遊ぶ';
  else if(phase==='play'){b2.textContent='この2枚を出す';b2.disabled=sel.length!==2}
  else if(phase==='result')b2.textContent='次のターンへ';
  else{b2.textContent='選んでください';b2.disabled=true}
  $('log').innerHTML=log.map(s=>`<div>${s}</div>`).join('');
}
init();
</script></body></html>
